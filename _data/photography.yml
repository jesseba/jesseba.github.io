# Photography collections, in display order on /photography/.
#
# Editorial metadata only — hand-written and safe from the import scripts.
# Per-photo manifests (urls, dimensions, locations, captions) live in
# _data/photos/<slug>.yml and are generated by bin/import-flickr or
# bin/import-photos.
#
# Fields:
#   slug      keys _data/photos/<slug>.yml and the page permalink
#   title     collection name
#   location  subtitle line
#   year      display year or range
#   blurb     one line on the index tile; keep it short
#   cover     photo id (Flickr) or filename (local) for the index tile
#             (falls back to the first photo in the manifest)
#   group_by_location
#             true  -> gallery renders a subheading per chapter, in `locations` order
#             false -> one continuous justified grid
#   locations ordered list of chapters; controls subheading order and precedence.
#             Each entry is `name:` plus an optional `tag:`.
#
#               name  the heading shown on the page
#               tag   the Flickr tag that files a photo into this chapter.
#                     Omit it and the tag is derived from the name by lowercasing
#                     and dropping non-alphanumerics.
#
#             Set `tag` explicitly whenever the heading is long or may be
#             reworded — it decouples the two, so renaming a chapter never
#             orphans photos already tagged on Flickr.
#
#             Tags are compared with non-alphanumerics stripped from both sides,
#             so on Flickr you can type them hyphenated (`ala-bel-pass`) or
#             spaced ("Ala-Bel Pass"); Flickr strips them either way.
#
#             A chapter with no photos is skipped silently. Photos whose tag
#             matches nothing render in a trailing untitled block rather than
#             disappearing.

- slug: utah-arizona-2021
  title: Utah/Arizona
  location:
  year: 2021
  blurb: What is the difference between a national park and a national monument?
  cover:
  group_by_location: true
  locations:
    - name: Zion National Park
      tag: zion
    - name: Bryce Canyon National Park
      tag: bryce
    - name: Grand Staircase-Escalante National Monument
      tag: grand-staircase-escalante
    - name: Vermilion Cliffs National Monument
      tag: vermilion-cliffs
    # Cane Beds is an unincorporated community, not a park or monument.
    - name: Cane Beds
      tag: cane-beds

- slug: kyrgyzstan-2026
  title: Kyrgyzstan
  location: Tien Shan
  year: 2026
  blurb: I still can't believe I was there to take these photos.
  # "Survivor's Path in Ala Archa" — the camp at dusk.
  cover: "55477196516"
  group_by_location: true
  # Chapters in chronological order, not alphabetical or geographic — this is the
  # sequence the trip actually happened in, so the page reads as a narrative.
  #
  # Order is also PRECEDENCE: matching stops at the first chapter whose tag is on
  # the photo, so give each photo exactly one chapter tag. Chapters covering the
  # same place or event (the four Korumdu ones, Alysh vs Er Enish) are the easy
  # ones to double-tag by accident.
  locations:
    - name: Bishkek
      tag: bishkek
    - name: To Ala Archa
      tag: to-ala-archa
    - name: Ala Archa
      tag: ala-archa
    - name: Ala Archa to Suusamyr
      tag: ala-archa-to-suusamyr
    - name: Ala-Bel Pass
      tag: ala-bel-pass
    - name: First Suusamyr homestay
      tag: first-suusamyr-homestay
    - name: Morning rituals
      tag: morning-rituals
    - name: Toi Preparations
      tag: toi-preparations
    - name: Alysh
      tag: alysh
    - name: Er Enish
      tag: er-enish
    - name: Kyz Kuumai
      tag: kyz-kuumai
    - name: Before Ulak Tartysh
      tag: before-ulak-tartysh
    - name: Ulak Tartysh
      tag: ulak-tartysh
    - name: Milking horses for kumys
      tag: milking-horses-for-kumys
    - name: Last day with Aydar
      tag: last-day-with-aydar
    - name: Suusamyr Jailoo
      tag: suusamyr-jailoo
    - name: Bees
      tag: bees
    - name: Suusamyr to Korumdu
      tag: suusamyr-to-korumdu
    - name: Kojomkul
      tag: kojomkul
    - name: Korumdu of Naryn Region
      tag: korumdu
    - name: After the Earthquake
      tag: after-the-earthquake
    - name: Milky Way
      tag: milky-way
    - name: Down Korumdu Mountain
      tag: down-korumdu-mountain
    - name: Korumdu Artifacts
      tag: korumdu-artifacts
    - name: Korumdu to Bokonbayevo
      tag: korumdu-to-bokonbayevo
    - name: Eagle Hunter
      tag: eagle-hunter
    - name: Issyk-Kul
      tag: issyk-kul
    - name: Skazka Canyon
      tag: skazka-canyon
    - name: Karakol
      tag: karakol
    - name: UAZ
      tag: uaz
    - name: Altyn Arashan
      tag: altyn-arashan
