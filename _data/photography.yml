# Photography collections, in display order on /photography/.
#
# Editorial metadata only — hand-written and safe from the import scripts.
# Per-photo manifests (urls, dimensions, locations, captions) live in
# _data/photos/<slug>.yml and are generated by bin/import-flickr or
# bin/import-photos.
#
# Fields:
#   slug      keys _data/photos/<slug>.yml and the page permalink
#   title     collection name
#   location  subtitle line
#   year      display year or range
#   blurb     one line on the index tile; keep it short
#   cover     photo id (Flickr) or filename (local) for the index tile
#             (falls back to the first photo in the manifest)
#   group_by_location
#             true  -> gallery renders a subheading per location, in `locations` order
#             false -> one continuous justified grid
#   locations ordered list of location names; controls subheading order.
#             A location with no photos in the manifest is skipped silently, and
#             photos whose location is blank render in a trailing untitled block.
#             Each name maps to a Flickr tag by lowercasing and dropping
#             non-alphanumerics. Tag convention on Flickr is hyphenated —
#             "Ala-Bel Pass" is tagged `ala-bel-pass` — which works because
#             Flickr's API strips hyphens and spaces from the tags it returns,
#             and matching normalises both sides the same way. Hyphens survive
#             only in Flickr's own UI, so they cost nothing here.

- slug: utah-arizona-2021
  title: Utah/Arizona
  location:
  year: 2021
  blurb: What is the difference between a national park and a national monument?
  cover:
  group_by_location: true
  locations:
    - Zion
    - Bryce
    - Grand Staircase-Escalante
    - Vermilion Cliffs
    - Cane Beds

- slug: kyrgyzstan-2026
  title: Kyrgyzstan
  location: Tien Shan
  year: 2026
  blurb: I still can't believe I was there to take these photos.
  # "Survivor's Path in Ala Archa" — the camp at dusk.
  cover: "55477196516"
  group_by_location: true
  # Chapters in chronological order, not alphabetical or geographic — this is the
  # sequence the trip actually happened in, so the page reads as a narrative.
  #
  # Order is also PRECEDENCE: matching stops at the first chapter whose tag is on
  # the photo, so give each photo exactly one chapter tag. Chapters covering the
  # same place or event (the four Korumdu ones, Alysh vs Er Enish) are the easy
  # ones to double-tag by accident.
  locations:
    - Bishkek
    - To Ala Archa
    - Ala Archa
    - Ala Archa to Suusamyr
    - Ala-Bel Pass
    - First Suusamyr homestay
    - Morning rituals
    - Toi Preparations
    - Alysh
    - Er Enish
    - Kyz Kuumai
    - Before Ulak Tartysh
    - Ulak Tartysh
    - Milking horses for kumys
    - Last day with Aydar
    - Suusamyr Jailoo
    - Bees
    - Suusamyr to Korumdu
    - Kojomkul
    - Korumdu of Naryn Region
    - After the Earthquake
    - Milky Way
    - Down Korumdu Mountain
    - Korumdu Artifacts
    - Korumdu to Bokonbayevo
    - Eagle Hunter
    - Issyk-Kul
    - Skazka Canyon
    - Karakol
    - UAZ
    - Altyn Arashan
