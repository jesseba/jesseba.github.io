# Photography collections, in display order on /photography/.
#
# Editorial metadata only — hand-written and safe from the import scripts.
# Per-photo manifests (urls, dimensions, locations, captions) live in
# _data/photos/<slug>.yml and are generated by bin/import-flickr or
# bin/import-photos.
#
# Fields:
#   slug      keys _data/photos/<slug>.yml and the page permalink
#   title     collection name
#   location  subtitle line
#   year      display year or range
#   blurb     one line on the index tile; keep it short
#   cover     photo id (Flickr) or filename (local) for the index tile
#             (falls back to the first photo in the manifest)
#   group_by_location
#             true  -> gallery renders a subheading per chapter, in `locations` order
#             false -> one continuous justified grid
#   locations ordered list of chapters; controls subheading order and precedence.
#             Each entry is `name:` plus an optional `tag:`.
#
#               name  the heading shown on the page
#               tag   the Flickr tag that files a photo into this chapter.
#                     Omit it and the tag is derived from the name by lowercasing
#                     and dropping non-alphanumerics.
#
#             Set `tag` explicitly whenever the heading is long or may be
#             reworded — it decouples the two, so renaming a chapter never
#             orphans photos already tagged on Flickr.
#
#             Tags are compared with non-alphanumerics stripped from both sides,
#             so on Flickr you can type them hyphenated (`ala-bel-pass`) or
#             spaced ("Ala-Bel Pass"); Flickr strips them either way.
#
#             A chapter with no photos is skipped silently. Photos whose tag
#             matches nothing render in a trailing untitled block rather than
#             disappearing.

- slug: utah-arizona-2021
  title: Utah/Arizona
  location:
  year: 2021
  blurb: What is the difference between a national park and a national monument?
  cover:
  group_by_location: true
  locations:
    - name: Zion National Park
      tag: zion
    - name: Bryce Canyon National Park
      tag: bryce
    - name: Grand Staircase-Escalante National Monument
      tag: grand-staircase-escalante
    - name: Vermilion Cliffs National Monument
      tag: vermilion-cliffs
    # Cane Beds is an unincorporated community, not a park or monument.
    - name: Cane Beds
      tag: cane-beds

- slug: kyrgyzstan-2026
  title: Kyrgyzstan
  location: Tien Shan
  year: 2026
  blurb: May our luck never run out.
  # "Survivor's Path in Ala Archa" — the camp at dusk.
  cover: "55477196516"
  group_by_location: true
  # Chapters in chronological order, not alphabetical or geographic — this is the
  # sequence the trip actually happened in, so the page reads as a narrative.
  #
  # Order is also PRECEDENCE: matching stops at the first chapter whose tag is on
  # the photo, so give each photo exactly one chapter tag. Chapters covering the
  # same place or event (the four Korumdu ones, Alysh vs Er Enish, the first
  # homestay vs the second) are the easy ones to double-tag by accident.
  locations:
    - name: Bishkek
      tag: bishkek
    - name: To Ala Archa
      tag: to-ala-archa
    - name: Ala Archa
      tag: ala-archa
      # "Ala Archa peaks" — the range itself, and already 3:2.
      cover: "55478127490"
    # The driving legs, gathered under one heading rather than scattered as
    # five short chapters across the trip. It sits where the first of them fell,
    # so the run up to Too-Ashuu still reads in place; the later legs are lifted
    # out of their chronological slots to join it.
    #
    # `tags` is the multi-tag form: any one of these files a photograph here.
    - name: On the Road
      tags: [ala-archa-to-suusamyr, ala-bel-pass, suusamyr-landscapes, suusamyr-to-korumdu, korumdu-to-bokonbayevo]
    - name: First Suusamyr homestay
      tag: first-suusamyr-homestay
    - name: Morning rituals
      tag: morning-rituals
    - name: Toi Preparations
      tag: toi-preparations
    - name: Alysh
      tag: alysh
      # "get ready" — the black-and-white belt grip, not the first frame.
      cover: "55479014396"
    - name: Er Enish
      tag: er-enish
      # "wrestling on horses" — the black-and-white grapple. 4:3, so the tile
      # trims a little off the top and bottom; every wrestler survives it.
      cover: "55479404715"
    - name: Kyz Kuumai
      tag: kyz-kuumai
      # The girl level with the boy in camouflage, whip up. Already 3:2.
      cover: "55479253119"
    - name: Before Ulak Tartysh
      tag: before-ulak-tartysh
    - name: Ulak Tartysh
      tag: ulak-tartysh
      # "scoring" — the full reach off the saddle, and already 3:2, so the tile
      # crops nothing away.
      cover: "55482498842"
    - name: Milking horses for kumys
      tag: milking-horses-for-kumys
      # The close shot of the milk going into the pail. Already 3:2.
      cover: "55478420843"
    - name: Last day with Aydar
      tag: last-day-with-aydar
    - name: Second Suusamyr homestay
      tag: second-suusamyr-homestay
    - name: Bees
      tag: bees
    - name: Kojomkul
      tag: kojomkul
    # Empty as of 2026-08-25: its only photograph was a portrait, and portraits
    # now gather in their own chapter at the end. An empty chapter is skipped
    # silently and gets no page, so this renders nothing today — the tag is kept
    # so the next thing shot in the village has somewhere to land.
    - name: Korumdu of Naryn Region
      tag: korumdu
    - name: Earthquake during hike
      tag: korumdu-earthquake
      # The close frame: dust pouring off the face, not the wide valley view.
      cover: "55484131343"
    - name: Milky Way
      tag: milky-way
    - name: Down Korumdu Mountain
      tag: down-korumdu-mountain
    - name: Korumdu Artifacts
      tag: korumdu-artifacts
    - name: Eagle Hunter
      tag: eagle-hunter
      # "talons" — the grip itself, not the bird entire. Already 3:2.
      cover: "55483972542"
    - name: Issyk-Kul
      tag: issyk-kul
      # "Issyk-kul is cool". Already 3:2.
      cover: "55485387445"
    - name: Skazka Canyon
      tag: skazka-canyon
    - name: Karakol
      tag: karakol
    - name: UAZ
      tag: uaz
    - name: Altyn Arashan
      tag: altyn-arashan
      # "home for a bit". Already 3:2.
      cover: "55485443025"
    # The faces of the trip, gathered out of chronology as a closing suite —
    # the one chapter here organised by subject rather than by where the day
    # went. It sits last so the trip still reads front to back and the suite
    # lands as a coda.
    #
    # That position has a cost worth knowing: order is precedence, so a
    # photograph tagged both `portraits` and a place tag files under the place
    # and never reaches here. The `portraits` tag therefore only carries a
    # frame on its own; the portraits already tagged for a place are moved
    # here by CHAPTERS in bin/photo_edit.py instead. Tag a new portrait
    # `portraits` and nothing else, and it lands here with no code change.
    - name: Portraits
      tag: portraits
      # "portrait 2" — the only one of the three already 3:2, so the tile
      # crops nothing away.
      cover: "55478963590"
